<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zotero Citation Graph</title>
<script src="vendor/vis-network.min.js"></script>
<script src="out/graph-data.js"></script>
<style>
  :root { --bg:#ffffff; --panel:#f4f6f9; --line:#d7dde5; --ink:#1b2330;
          --muted:#5b6675; --accent:#1f6feb; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { display:flex; flex-direction:column; height:100vh; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel);
    display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:23px; margin:0; font-weight:700; }
  header .stats { color:var(--muted); font-size:16px; }
  header .hint { color:var(--accent); font-size:15.5px; margin-left:auto; }
  #search { background:#fff; border:1px solid var(--line); color:var(--ink);
    border-radius:6px; padding:9px 12px; font-size:16px; width:300px; }
  #net { flex:1; min-height:0; background:#ffffff; }
  .legend { position:absolute; left:16px; bottom:16px; background:rgba(255,255,255,.94);
    border:1px solid var(--line); border-radius:10px; padding:13px 15px; font-size:16px;
    color:var(--ink); box-shadow:0 2px 10px rgba(20,30,50,.08); max-width:320px; }
  .legend .t { font-weight:700; font-size:18px; margin-bottom:9px; }
  .legend .row { display:flex; align-items:center; gap:10px; padding:5px 5px; border-radius:6px;
    cursor:pointer; }
  .legend .row:hover { background:#eef2f7; }
  .legend .row.off { opacity:.38; }
  .legend .swatch { width:17px; height:17px; border-radius:50%; flex:0 0 auto;
    border:1px solid rgba(0,0,0,.25); }
  .legend .count { color:var(--muted); margin-left:auto; }
  .legend .note { color:var(--muted); margin-top:10px; font-size:14px; line-height:1.55; }
  #empty { margin:auto; max-width:560px; padding:40px; text-align:center; color:var(--muted); }
  code { background:#eef2f7; border:1px solid var(--line); border-radius:4px; padding:1px 5px;
    color:var(--ink); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>📚 Zotero Citation Graph</h1>
    <span class="stats" id="stats"></span>
    <input id="search" type="search" placeholder="Filter papers by title / author…" autocomplete="off">
    <span class="hint">Click a node → open the paper · click legend → filter by genre</span>
  </header>
  <div id="net"></div>
  <div class="legend" id="legend"></div>
</div>

<script>
(function () {
  const G = window.GRAPH;
  const host = document.getElementById("net");
  if (!G || !G.nodes || !G.nodes.length) {
    host.innerHTML =
      '<div id="empty"><h2>No graph data</h2><p>Build it first:</p>' +
      '<p><code>python3 build_graph.py --input sample/oncology.json --out out</code></p>' +
      '<p>then reload this page.</p></div>';
    return;
  }

  document.getElementById("stats").textContent =
    G.stats.papers + " papers · " + G.stats.edges + " citation links · built " + G.generated;

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>]/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
  function darken(hex, f) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || "#8d99ae");
    const n = m ? parseInt(m[1], 16) : 0x8d99ae;
    const r = Math.round(((n >> 16) & 255) * f),
          g = Math.round(((n >> 8) & 255) * f),
          b = Math.round((n & 255) * f);
    return "rgb(" + r + "," + g + "," + b + ")";
  }
  function tooltip(n) {
    const el = document.createElement("div");
    el.style.maxWidth = "400px"; el.style.font = "16px system-ui, sans-serif";
    el.innerHTML =
      "<b>" + esc(n.title) + "</b><br>" +
      "<span style='color:#5b6675'>" + esc(n.authors || "") +
      (n.year ? " · " + esc(n.year) : "") + "</span>" +
      (n.venue ? "<br><i style='color:#5b6675'>" + esc(n.venue) + "</i>" : "") +
      "<br><b style='color:" + darken(n.color, 0.8) + "'>" + esc(n.genre) + "</b>" +
      " · cited by " + (n.cited_by || 0) + " in your library" +
      "<br><span style='color:#1f6feb'>click to open ↗</span>";
    return el;
  }

  const nodes = new vis.DataSet(G.nodes.map(n => ({
    id: n.id, label: n.label, value: n.value || 1, url: n.url, genre: n.genre,
    title: tooltip(n),
    color: { background: n.color, border: darken(n.color, 0.65),
             highlight: { background: n.color, border: "#1b2330" } },
    font: { color: "#1b2330", size: 20, strokeWidth: 5, strokeColor: "#ffffff" },
  })));
  const edges = new vis.DataSet(G.edges.map(e => ({ from: e.from, to: e.to, arrows: "to" })));

  const network = new vis.Network(host, { nodes, edges }, {
    nodes: { shape: "dot", borderWidth: 1.5,
      scaling: { min: 12, max: 52, label: { enabled: true, min: 18, max: 38 } } },
    edges: { color: { color: "#c2cad6", highlight: "#6b7686", opacity: 0.9 },
      width: 1.3, smooth: { type: "continuous" }, arrows: { to: { scaleFactor: 0.6 } } },
    physics: { barnesHut: { gravitationalConstant: -12000, centralGravity: 0.25,
      springLength: 170, springConstant: 0.04, damping: 0.6, avoidOverlap: 1 },
      stabilization: { iterations: 300 } },
    interaction: { hover: true, tooltipDelay: 90, keyboard: false },
  });

  // CLICK A NODE -> OPEN THE PAPER WEBSITE
  network.on("click", function (params) {
    if (params.nodes && params.nodes.length) {
      const n = nodes.get(params.nodes[0]);
      if (n && n.url) window.open(n.url, "_blank", "noopener");
    }
  });
  network.on("hoverNode", () => host.style.cursor = "pointer");
  network.on("blurNode", () => host.style.cursor = "default");

  // ---- legend (genre colour key) + filtering --------------------------------
  let activeGenre = null;            // null = show all
  let searchText = "";
  const byId = G.nodes.reduce((m, n) => (m[n.id] = n, m), {});
  function applyFilter() {
    nodes.update(G.nodes.map(n => {
      const okGenre = !activeGenre || n.genre === activeGenre;
      const okText = !searchText ||
        (n.title + " " + n.authors + " " + n.label).toLowerCase().includes(searchText);
      const on = okGenre && okText;
      return { id: n.id, opacity: on ? 1 : 0.1,
        color: { background: byId[n.id].color, border: darken(byId[n.id].color, 0.65) } };
    }));
  }

  const legend = document.getElementById("legend");
  let html = '<div class="t" id="legtitle">Research genre</div>';
  G.genres.forEach(g => {
    html += '<div class="row" data-g="' + esc(g.name) + '">' +
      '<span class="swatch" style="background:' + g.color + '"></span>' +
      '<span>' + esc(g.name) + '</span><span class="count">' + g.count + '</span></div>';
  });
  html += '<div class="note"><b>size</b> = times cited within your library' +
          '<br><b>arrow A→B</b> = paper A cites paper B</div>';
  legend.innerHTML = html;
  legend.querySelectorAll(".row").forEach(row => {
    row.addEventListener("click", () => {
      const g = row.getAttribute("data-g");
      activeGenre = (activeGenre === g) ? null : g;     // toggle
      legend.querySelectorAll(".row").forEach(r =>
        r.classList.toggle("off", activeGenre && r.getAttribute("data-g") !== activeGenre));
      applyFilter();
    });
  });
  document.getElementById("legtitle").addEventListener("click", () => {
    activeGenre = null;
    legend.querySelectorAll(".row").forEach(r => r.classList.remove("off"));
    applyFilter();
  });
  document.getElementById("search").addEventListener("input", e => {
    searchText = e.target.value.trim().toLowerCase(); applyFilter();
  });

  // expose for the headless driver
  window.__graph = { network, nodes, edges };
  network.once("stabilizationIterationsDone", () => {
    network.fit();
    document.body.setAttribute("data-stable", "1");
  });
})();
</script>
</body>
</html>
